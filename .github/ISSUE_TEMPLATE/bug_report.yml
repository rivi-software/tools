name: Bug report
description: A package or rivi-bot does not do what its README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability goes in a private report, never here: [SECURITY.md](https://github.com/rivi-software/tools/blob/main/SECURITY.md) says how.
  - type: input
    id: package
    attributes:
      label: Package and version
      description: The package and the version you installed, or the rivi-bot tag or commit you use.
      placeholder: "@rivi-software/workers-mail 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Where it runs
      description: Node, a Cloudflare Worker or the browser, with the versions of what the package plugs into (Vite, React, TanStack Start, Wrangler).
      placeholder: Node 24, Vite 8, React 19
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste errors and logs as text.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: The smallest code, configuration or repository that shows it. If it happens only sometimes, say when you have seen it.
    validations:
      required: true
