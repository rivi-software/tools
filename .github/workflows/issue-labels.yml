name: Issue labels

# On each new issue, as RIVI Bot, Clef picks what the issue lacks: its type, a scope:* label,
# topic labels, and the organization's Priority and Effort fields (scripts/label-issue.ts). An
# answer Clef is unsure of is left for a maintainer, and an issue from outside the team also gets
# needs-triage when it opens. It only adds: a label, type or field value someone set stays, and a
# label someone took off is never added again. Run it by hand to label an issue again, or one that
# opened before this ran; a run by hand adds no needs-triage.
#
# Off until the repository variable RIVI_BOT_AI_ENABLED is "true", which needs the variable
# CLOUDFLARE_ACCOUNT_ID and the secret CLOUDFLARE_AI_API_TOKEN (Workers AI Read), and
# CLOUDFLARE_AI_GATEWAY_TOKEN (AI Gateway Run) unless that token also has it. Clef runs on Workers
# AI through the authenticated AI Gateway github-rivi-tools, which logs each call.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: number

permissions: {}

concurrency:
  group: issue-labels-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  label:
    name: Label the issue
    if: vars.RIVI_BOT_AI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-issues: write

      # The script imports only Node built-ins and its own module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/issue-labels.ts
            scripts/label-issue.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Ask Clef and label the issue
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
        run: node scripts/label-issue.ts
