name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The packages support Node 22 and later, until 22's end of life on 2027-04-30; then the
        # floor moves to 24 (here, in `engines` and in @types/node). .node-version is the one
        # we develop on.
        node: ["22", "24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check publishable manifests
        run: pnpm run check:manifests

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check packed packages
        run: pnpm run check:packages

  # The check the main ruleset requires (.github/rulesets/main.json). It passes only when every
  # Node version above passed, so the matrix can change without changing the ruleset. It runs
  # even when one of them failed: a skipped check would count as passing.
  verified:
    name: verify
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Every Node version passed
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "The Node versions together: $RESULT"
          test "$RESULT" = success

  # rivi-bot/install-bun.sh gives claude-code-action a Bun from the npm registry, pinned by version
  # and integrity. This installs it on both runner architectures, and fails when it is not the Bun
  # the actions' claude-code-action pins, as after Dependabot moves that action.
  rivi-bot-bun:
    name: rivi-bot's Bun on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        id: bun
        run: bash rivi-bot/install-bun.sh

      - name: Match claude-code-action's Bun
        env:
          GH_TOKEN: ${{ github.token }}
          BUN_PATH: ${{ steps.bun.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$BUN_PATH" ]; then
            echo "::error::install-bun.sh installed no Bun; its warning above says why."
            exit 1
          fi
          refs=$(grep -rhoE 'anthropics/claude-code-action@[0-9a-f]{40}' rivi-bot | sort -u)
          if [ "$(wc -l <<< "$refs")" != 1 ]; then
            echo "::error::The rivi-bot actions use different commits of claude-code-action: $(tr "\n" " " <<< "$refs")"
            exit 1
          fi
          pinned=$(gh api -H Accept:application/vnd.github.raw "repos/anthropics/claude-code-action/contents/action.yml?ref=${refs#*@}" \
            | yq '.runs.steps[] | select(.id == "setup-bun") | .with["bun-version"]')
          installed=$("$BUN_PATH" --version)
          echo "claude-code-action pins Bun $pinned; install-bun.sh installed $installed."
          if [ "$installed" != "$pinned" ]; then
            echo "::error::Move the version and integrities in rivi-bot/install-bun.sh to Bun $pinned."
            exit 1
          fi
