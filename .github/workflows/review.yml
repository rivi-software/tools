name: review

# rivi-bot reviews this repository's pull requests: the reusable workflow in rivi-bot.yml, which
# says when. `./` runs it from the same commit as this file, and pull_request_target takes that
# from main: never the pull request's version. Other repositories call it as
# rivi-software/tools/.github/workflows/rivi-bot.yml@main (rivi-bot/README.md#setup).
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  rivi-bot:
    uses: ./.github/workflows/rivi-bot.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      app-client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
      # The review runs on Workers AI through the authenticated AI Gateway github-rivi-tools, as
      # Clef's issue labels do (issue-labels.yml).
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ai-gateway: github-rivi-tools
    secrets:
      cloudflare-ai-api-token: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      cloudflare-ai-gateway-token: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_REVIEW_API_KEY }}
      app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
