name: rivi-bot release

# Drafts the next rivi-bot release (CONTRIBUTING.md#a-rivi-bot-release): a GitHub release of a
# rivi-bot-v<major>.<minor>.<patch> tag on a commit of main, not published yet. A maintainer runs it
# by hand from main once a change to rivi-bot/ or .github/workflows/rivi-bot.yml has merged that
# callers who pin should get. scripts/release-rivi-bot.ts checks that the commit is on main, comes
# after the last release and changes rivi-bot, and that CI passed on it. The version follows the
# last tag and the Conventional Commits titles since it, unless the run names the part to raise. The
# draft's notes list those commits; the maintainer rewrites them for the people who run rivi-bot
# and publishes the release, which creates the tag. A tag is never moved or deleted
# (.github/rulesets/release-tags.json), so nothing is tagged before someone has read the notes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: The part of the version to raise. auto reads it from the commit titles since the last release.
        type: choice
        options: [auto, major, minor, patch]
        default: auto
      commit:
        description: The commit on main to release, as a SHA. Empty for the head of main.
        type: string
        required: false

permissions: {}

concurrency:
  group: rivi-bot-release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft the release
    if: github.repository == 'rivi-software/tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # CI's run on the commit
      contents: write # the draft release
    steps:
      # Every commit and tag: the version follows the last rivi-bot-v* tag, and the notes list the
      # commits since it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The script imports only Node built-ins and its own module.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Draft the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          COMMIT: ${{ inputs.commit }}
        run: node scripts/release-rivi-bot.ts
