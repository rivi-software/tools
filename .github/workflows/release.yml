name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    if: github.repository == 'rivi-software/tools'
    # npm trusted publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No registry-url: setup-node would write an .npmrc with a placeholder token, which pnpm
          # would send instead of using trusted publishing.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      # RIVI Bot, not github-actions, writes the version commit, the "Version packages" pull
      # request, the tags and the GitHub releases, through the GitHub API, so its commits are
      # signed. CI starts on the App's pushes by itself; on GITHUB_TOKEN's it waits for a
      # maintainer to approve the run. Minted after Verify, so the hour-long token outlasts the
      # publish.
      - name: Mint the RIVI Bot token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write # the version commit, tags and GitHub releases
          permission-pull-requests: write # the "Version packages" pull request

      - name: Open the version pull request or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token }}

  github-packages:
    name: Copy to GitHub Packages
    needs: release
    # It copies only what npm has already, so it runs after a release that failed too, and copies
    # whatever that release did publish.
    if: ${{ !cancelled() && github.repository == 'rivi-software/tools' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publish to GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Copies npm's tarball of every release GitHub Packages lacks; the first run copies every
      # release since each package's first.
      - name: Copy the releases GitHub Packages lacks
        run: node scripts/mirror-github-packages.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
