name: rivi-bot

# rivi-bot reviews pull requests with Claude, through the rivi-bot action (rivi-bot/action.yml).
# This is a reusable workflow: a repository calls it from a workflow on pull_request_target
# (rivi-bot/README.md#setup), as this one does from review.yml. The event, github.token and the
# repository are the caller's.
#
# - A pull request by someone who can write to the repository is reviewed when it opens or leaves
#   draft, and after every push. Its review approves when nothing has to change.
# - Any other pull request waits for a maintainer's approval: adding the `rivi-bot:review` label.
#   The label stays on, so every later push is reviewed too, until a maintainer takes it off.
#   These reviews only comment: an approval is what a prompt injection would aim for.
# - A push to a draft is not reviewed; the label still asks for a review of one.
#
# A review after the first reads only what changed since the last one. Pull requests from forks
# are reviewed too: pull_request_target runs the calling workflow as it is on the default branch,
# with the secrets, and the review only reads the pull request; nothing from it runs. Labeling
# needs triage access, and the gate also checks that whoever added the label can write to the
# repository. Issues get nothing from rivi-bot for now.
on:
  workflow_call:
    inputs:
      app-client-id:
        description: The client ID of a GitHub App installed on the repository, with Contents read and Pull requests write. The reviews then come from the App rather than github-actions.
        type: string
        required: false
        default: ""
      focus:
        description: What else this repository's reviews look for, added to the list Claude checks.
        type: string
        required: false
        default: ""
    secrets:
      anthropic-api-key:
        description: The Anthropic API key Claude runs on, from a workspace with a spend limit.
        required: true
      app-private-key:
        description: The private key of the App named by app-client-id.
        required: false

permissions: {}

jobs:
  # Whether to review this commit, and whether the review may approve.
  gate:
    name: gate
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'rivi-bot:review') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # takes off a label that someone without write access added
    outputs:
      review: ${{ steps.check.outputs.review }}
      approve: ${{ steps.check.outputs.approve }}
    steps:
      - name: Check the approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'rivi-bot:review') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Call rivi-bot from a workflow on pull_request_target (https://github.com/rivi-software/tools/blob/main/rivi-bot/README.md#setup)."
            exit 1
          fi
          can_write() {
            case "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission)" in
              admin | maintain | write) return 0 ;;
              *) return 1 ;;
            esac
          }
          internal=false
          if can_write "$AUTHOR"; then internal=true; fi

          if [ "$ACTION" = labeled ]; then
            if ! can_write "$SENDER"; then
              echo "::error::@$SENDER cannot write to the repository; a maintainer with write access approves reviews."
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/rivi-bot%3Areview" --silent || true
              exit 1
            fi
            echo "@$SENDER approved reviews of #$PR_NUMBER."
          elif [ "$internal" = true ]; then
            echo "@$AUTHOR can write to the repository; #$PR_NUMBER is reviewed on every push."
          elif [ "$LABELED" = true ] &&
            approver=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events" --paginate \
              --jq '.[] | select(.event == "labeled" and .label.name == "rivi-bot:review") | .actor.login' | tail -n 1) &&
            [ -n "$approver" ] && can_write "$approver"; then
            # The label is on, and whoever added it last can still write to the repository.
            echo "@$approver approved reviews of #$PR_NUMBER."
          else
            echo "#$PR_NUMBER waits for a maintainer to add the rivi-bot:review label."
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "review=true"
            echo "approve=$internal"
          } >> "$GITHUB_OUTPUT"

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One review of a pull request at a time; none that started is cancelled, since a
    # half-posted review helps nobody. Of the pushes that wait, only the latest is reviewed.
    concurrency:
      group: rivi-bot-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the credentials
        env:
          KEY_SET: ${{ secrets.anthropic-api-key != '' }}
        run: |
          if [ "$KEY_SET" != "true" ]; then
            echo "::error::The anthropic-api-key secret is empty; set the Actions secret the caller passes (https://github.com/rivi-software/tools/blob/main/rivi-bot/README.md#setup)."
            exit 1
          fi

      # The review comes from the App when the caller names one, else from github-actions.
      - name: Get the App's token
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: read
          permission-pull-requests: write

      # The action as it is on main, wherever the caller pins this file: never the pull request's
      # version.
      - name: Review
        id: review
        uses: rivi-software/tools/rivi-bot@main
        with:
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          github-token: ${{ steps.app.outputs.token || github.token }}
          reviewer: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || 'github-actions[bot]' }}
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          approve: ${{ needs.gate.outputs.approve }}
          focus: ${{ inputs.focus }}

      - name: Report a failed review
        if: failure() && steps.review.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "rivi-bot could not review $HEAD_SHA ([the run]($RUN_URL)). A maintainer can re-run it."
