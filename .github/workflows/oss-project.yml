name: Open-source project

# Adds the open issues and pull requests of every public repository in the organization to the
# RIVI Open Source project (https://github.com/orgs/rivi-software/projects/2), as RIVI Bot, each
# with a first Status: Triage for an issue, In Review for a pull request and In Progress for a
# draft (scripts/add-to-project.ts). A search finds what is not on the project yet, so a new public
# repository needs nothing to take part, and a private one never does. What a bot opened stays off,
# such as Dependabot's updates and the release pull request. The project's own workflows move the
# cards from there.
#
# It runs every half hour, when an issue or a pull request opens here, and by hand. Nothing here
# checks out or runs a pull request's code: pull_request_target runs main's workflow, and the
# script only searches and adds.
on:
  schedule:
    - cron: "7,37 * * * *"
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: oss-project
  cancel-in-progress: false

jobs:
  add:
    name: Add new issues and pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A token for the organization's installation: the project belongs to the organization.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: write

      # The script imports only Node built-ins and its own module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/add-to-project.ts
            scripts/project-items.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Add them to the project
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: "2"
        run: node scripts/add-to-project.ts
