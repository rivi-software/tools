version: 2
updates:
  # The workflows on GitHub Actions, and CI's on Depot CI. One group bumps an action in both.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.depot/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # A bump of a published package's dependency ranges needs a changeset before it releases.
  # Dependabot writes none: the Changeset check (.github/workflows/changeset.yml) fails its pull
  # request until a maintainer pushes one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node follows the oldest Node the packages support (22), so type-checking catches an
      # API that Node 22 lacks; its next major comes with raising that floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # workers-bundle-check matches .assetsignore with the ignore major Wrangler bundles (5), so it
      # leaves out the assets Wrangler does; ignore 6 and later read some patterns differently.
      - dependency-name: "ignore"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
