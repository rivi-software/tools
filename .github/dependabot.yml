version: 2
updates:
  # The workflows on GitHub Actions, CI's on Depot CI, and each of rivi-bot's composite actions. A
  # directory listed here does not cover the ones below it, so a new action's directory goes here
  # too. One group bumps an action in all of them: every rivi-bot action moves to a new
  # claude-code-action in one pull request, where rivi-bot-bun.yml checks the Bun it pins.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.depot/workflows
      - /rivi-bot
      - /rivi-bot/ask
      - /rivi-bot/describe
      - /rivi-bot/fix
      - /rivi-bot/fix/push
      - /rivi-bot/housekeeping
      - /rivi-bot/triage
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # A bump of a published package's dependency ranges needs a changeset before it releases.
  # Dependabot writes none: the Changeset check (.github/workflows/changeset.yml) fails its pull
  # request until a maintainer pushes one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node follows the oldest Node the packages support (22), so type-checking catches an
      # API that Node 22 lacks; its next major comes with raising that floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # workers-bundle-check matches .assetsignore with the ignore major Wrangler bundles (5), so it
      # leaves out the assets Wrangler does; ignore 6 and later read some patterns differently.
      - dependency-name: "ignore"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
