packages:
  - packages/*

# Dependency build scripts are blocked unless listed here.
allowBuilds:
  # posthog-cli (a dependency of @posthog/rollup-plugin, the source map upload in
  # @rivi-software/posthog-tanstack-start) downloads its binary on first run, not at install.
  "@posthog/cli": false
  # core-js only prints a funding message.
  core-js: false
  # esbuild and workerd (through wrangler and miniflare, which @rivi-software/d1-migrations tests
  # against) take their binaries from optional platform packages; the scripts only check them.
  esbuild: false
  # lefthook's script runs `lefthook install`, which installs the Git hooks in lefthook.yml. It
  # takes its binary from optional platform packages, and skips the install in CI.
  lefthook: true
  workerd: false

# Supply-chain policy: no transitive dependencies from git or tarball URLs.
blockExoticSubdeps: true
